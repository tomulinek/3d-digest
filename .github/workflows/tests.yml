name: Testy generátoru

on:
  pull_request:
    paths: ['generator/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['generator/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
