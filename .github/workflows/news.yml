# Generátor novinek pro 3damuse.com: čte RSS, zpracuje články modelem Gemini
# a ukládá je do news_RRRR_MM.json v tomto repozitáři.
name: Novinky

on:
  schedule:
    # 4× denně (UTC). RSS některých zdrojů drží jen pár hodin článků.
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Co spustit'
        type: choice
        options: [run, add-url, clean, smoke-test]
        default: run
      url:
        description: 'Adresa článku (jen pro add-url)'
        required: false
        default: ''

permissions:
  contents: write

# Dva běhy najednou by si přepisovaly soubory; další počká
concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Generátor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ inputs.action }}
          ARTICLE_URL: ${{ inputs.url }}
        run: |
          case "$ACTION" in
            add-url)    python generate_news_json_github.py --add-url "$ARTICLE_URL" ;;
            clean)      python generate_news_json_github.py --clean ;;
            smoke-test) python generate_news_json_github.py --smoke-test ;;
            *)          python generate_news_json_github.py ;;
          esac
